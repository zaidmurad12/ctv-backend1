services:
  - type: web
    name: ctv-platform-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_HOST
        value: 0.0.0.0
      - key: API_PREFIX
        value: /api/v1
      - key: SWAGGER_ENABLED
        value: true
      - key: CORS_ORIGIN
        value: "*"
