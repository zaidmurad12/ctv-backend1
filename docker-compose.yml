version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ctv_dev
      POSTGRES_USER: ctv
      POSTGRES_PASSWORD: ctv
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ctv:ctv@postgres:5432/ctv_dev
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    env_file:
      - docker/config/env.template

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:8.12
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ctv.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
